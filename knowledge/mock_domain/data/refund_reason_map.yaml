# =============================================================================
# MOCK-DOMAIN PACK — refund reason code -> the party who bears the loss.
#
# A PACK DATA TABLE. Every `*.yaml` under a `data/` folder is loaded as one entry
# of `pack_data`, keyed by the FILE STEM — so this file is reachable as
# `pack_data['refund_reason_map']` and a condition references it by that name:
#
#     kind: value_mismatch
#     lookup:
#       data: refund_reason_map
#       from_entity: refund_claim
#
# WHY THIS ONE LIVES AT THE PACK ROOT rather than under a use case: the mapping
# from a reason code to a liable party is a fact about the DATA's vocabulary, true
# for every procedure that reads a reason code. Note that the loader flattens
# pack-root `data/` and every `use_cases/*/data/` into ONE global dict either way
# (use_cases win on a name collision), so a table under one use case is already
# globally reachable — which is precisely why the location has to be chosen on
# meaning rather than on reachability. Put it where the next author will look for
# it, and that is the root when the fact is about the data.
#
# The map is nested under a `map:` key here; the engine accepts both that and a
# bare top-level mapping, so either shape works.
# =============================================================================

map:
  DAMAGE: carrier
  LOST: carrier
  RTS: sender
  DELAY: carrier
  # Deliberately absent: any code outside this list. The `refund_reason_is_generic`
  # indicator uses `match_mode: allowed` against the same four codes, so an unmapped code
  # yields `unknown` for a lookup rather than a fabricated liable party. Omission is always
  # the safer failure — a wrong entry here invents a finding on a legitimate claim.
